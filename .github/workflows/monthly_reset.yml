name: Monthly Reset

on:
  schedule:
    - cron: '0 0 1 * *'  # أول كل شهر الساعة 12 منتصف الليل UTC
  workflow_dispatch:       # تقدري تشغليه يدوي للتيست

jobs:
  monthly_reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Run monthly reset
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/monthly_reset.js