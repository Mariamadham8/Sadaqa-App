name: Flutter CI/CD

on:
  push:
    branches:
      - main
      - publish_to_firebase

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) بتنزل الكود بتاعك على الجهاز الافتراضي (لازم دايمًا أول خطوة)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) بتظبط Flutter SDK على الجهاز عشان تقدري تستخدمي أوامره
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1" # نفس النسخة الشغالة محليًا (Dart 3.12.1)
          channel: "stable"

      # 3) بتجيب كل الـ packages من pubspec.yaml (زي flutter pub get عندك)
      - name: Install dependencies
        run: flutter pub get

      # 4) (اختياري بس مفيد) بتشغل التستات بتاعتك قبل ما تعملي build
      - name: Run tests
        run: flutter test

      # 5) بتبني الـ APK فعليًا
      - name: Build APK
        run: flutter build apk --release

      # 6) بترفع الـ APK كـ artifact عشان تقدري تنزليه من صفحة الـ Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # 7) بترفع نفس الـ APK على Firebase App Distribution عشان الـ testers ياخدوا إشعار بيه
      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.APPID }}
          serviceCredentialsFileContent: ${{ secrets.GOOGLE_APP_CREDINTIALS }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Automated build from GitHub Actions"
