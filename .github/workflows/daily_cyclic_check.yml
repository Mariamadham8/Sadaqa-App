name: Daily Cycle Check

on:
  schedule:
    - cron: '0 0 * * *'   # كل يوم الساعة 00:00 UTC — كل جروب بياخد بالو لوحده حسب startDate بتاعه
  workflow_dispatch: {}    # عشان تقدري تشغليه يدوي من تبويب Actions للتست

jobs:
  run-cycle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install firebase-admin

      - run: node dailyCycleCheck.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}